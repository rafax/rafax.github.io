<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafał Gajdulewicz</title>
<meta name="description" content="Rafał Gajdulewicz — Warsaw, PL.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111010'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' fill='%23f0ece4' text-anchor='middle'%3ERG%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/png" href="favicon.png">

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#111010"/>
    <text x="50" y="60" font-family="Georgia,serif" font-size="36" font-style="italic" fill="#f0ece4" text-anchor="middle">RG</text>
  </svg>
</template>

<style>
  :root {
    --bg: #111010;
    --ink: #f0ece4;
    --mute: rgba(240,236,228,0.45);
    --mute-2: rgba(240,236,228,0.7);
    --rule: rgba(240,236,228,0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .corner {
    position: absolute;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--mute);
  }
  .tl { top: 32px; left: 36px; }
  .tr { top: 32px; right: 36px; }
  .bl { bottom: 32px; left: 36px; display: flex; align-items: center; gap: 18px; }
  .br { bottom: 32px; right: 36px; }

  .divider {
    width: 1px;
    height: 10px;
    background: var(--rule);
    display: inline-block;
  }

  a.icon {
    color: var(--mute-2);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    line-height: 0;
    transition: color 0.2s ease;
  }
  a.icon:hover, a.icon:focus-visible { color: var(--ink); outline: none; }

  @media (max-width: 480px) {
    .corner { font-size: 10px; letter-spacing: 1.5px; }
    .tl, .tr { top: 24px; }
    .bl, .br { bottom: 24px; }
    .tl, .bl { left: 24px; }
    .tr, .br { right: 24px; }
    .bl { gap: 14px; }
  }
</style>
</head>
<body>
<main>
  <div class="corner tl">Rafał Gajdulewicz</div>
  <div class="corner tr">Warsaw, PL</div>

  <div class="corner bl">
    <span>gajdulewicz.com</span>
    <span class="divider" aria-hidden="true"></span>

    <a class="icon" href="https://www.linkedin.com/in/gajdulewicz/" aria-label="LinkedIn" rel="me noopener">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="8" y1="10" x2="8" y2="17"/>
        <circle cx="8" cy="7" r="0.6" fill="currentColor" stroke="none"/>
        <path d="M12 17v-4a2.5 2.5 0 0 1 5 0v4"/>
        <line x1="12" y1="10" x2="12" y2="17"/>
      </svg>
    </a>

    <a class="icon" href="https://github.com/rafax" aria-label="GitHub" rel="me noopener">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 19c-4 1.5-4-2-6-2m12 5v-3.5a3 3 0 0 0-.9-2.3c3-.3 6-1.5 6-6.5a4.7 4.7 0 0 0-1.3-3.3 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.8 11.8 0 0 0-6.2 0C6.7 2 5.7 2.3 5.7 2.3a4.3 4.3 0 0 0-.1 3.2A4.7 4.7 0 0 0 4.3 8.8c0 5 3 6.2 5.9 6.5a3 3 0 0 0-.9 2.3V22"/>
      </svg>
    </a>

    <a class="icon" href="https://www.instagram.com/rfks" aria-label="Instagram" rel="me noopener">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </div>

  <div class="corner br" id="year"></div>
</main>
<script>
  var n = new Date().getFullYear(), r = '';
  var v = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
  var s = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  for (var i = 0; i < v.length; i++) { while (n >= v[i]) { r += s[i]; n -= v[i]; } }
  document.getElementById('year').textContent = r;
</script>
</body>
</html>
